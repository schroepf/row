name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and run tests
        env:
          CONCEPT2_CLIENT_ID: ${{ secrets.CONCEPT2_CLIENT_ID }}
          CONCEPT2_CLIENT_SECRET: ${{ secrets.CONCEPT2_CLIENT_SECRET }}
          CONCEPT2_REDIRECT_URI: ${{ secrets.CONCEPT2_REDIRECT_URI }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:verifyPaparazziDebug
